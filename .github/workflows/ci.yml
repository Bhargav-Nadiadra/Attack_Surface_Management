name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asm
          POSTGRES_PASSWORD: asm
          POSTGRES_DB: asm
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U asm" --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://asm:asm@localhost:5432/asm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[dev]"
          cp .env.example .env

      - name: Lint
        run: |
          ruff check .
          black --check .
          isort --check-only .
          mypy

      - name: Test
        run: |
          alembic upgrade head
          pytest
